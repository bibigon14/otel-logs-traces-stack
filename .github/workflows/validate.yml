---
name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: karancode/yamllint-github-action@v3.0.0
        with:
          yamllint_file_or_dir: 'manifests'
          yamllint_strict: true
          yamllint_config_filepath: '.yamllint'

  kubeconform:
    name: kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Install kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xzf - -C /usr/local/bin kubeconform
          kubeconform -v
      # OpenTelemetry Collector CRDs live in the datreeio/CRDs-catalog repo
      # under the opentelemetry.io group. Grafana ecosystem resources
      # (LokiStack from the grafana.com group, if ever added) land in the
      # same catalog.
      - name: Validate manifests
        run: |
          kubeconform \
            -strict \
            -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -summary \
            manifests/
