---
# ServiceAccount + minimal RBAC for the OTEL Collector's k8sattributes
# processor. It needs to read pods, namespaces and replicasets to
# resolve pod -> deployment -> namespace relationships that enrich
# incoming OTLP spans and logs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otelcol-gateway
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otelcol-k8sattributes
rules:
  - apiGroups: ['']
    resources: [pods, namespaces, nodes]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets, deployments]
    verbs: [get, list, watch]
  - apiGroups: [extensions]
    resources: [replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otelcol-k8sattributes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otelcol-k8sattributes
subjects:
  - kind: ServiceAccount
    name: otelcol-gateway
    namespace: observability
