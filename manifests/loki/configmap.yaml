---
# Loki single-binary config - all components (distributor/ingester/
# querier/compactor) run inside one process, writing chunks + index to
# a single PVC. Fine for a shared-host demo; a real production setup
# would be simple-scalable mode with S3 and a BoltDB shipper.
#
# schema_config pins the newest TSDB index (v13); boltdb-shipper is the
# older index format and is deprecated upstream.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: observability
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: single-binary
data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9095
      log_level: info

    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory

    limits_config:
      retention_period: 168h  # 7 days
      allow_structured_metadata: true
      volume_enabled: true
      ingestion_rate_mb: 10
      ingestion_burst_size_mb: 20

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      retention_delete_delay: 2h
      compaction_interval: 10m
      delete_request_store: filesystem

    ruler:
      storage:
        type: local
        local:
          directory: /loki/rules
      rule_path: /loki/rule-cache

    analytics:
      reporting_enabled: false
