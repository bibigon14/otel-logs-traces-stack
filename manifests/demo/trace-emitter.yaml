---
# telemetrygen is the official OTEL load generator maintained upstream
# in opentelemetry-collector-contrib. It emits a steady stream of OTLP
# traces (and logs/metrics with the right subcommand) against a target
# endpoint, which gives this stack real traffic to show on screenshots.
#
# One pod runs `telemetrygen traces`, another runs `telemetrygen logs`.
# Together they generate a correlated signal: both share a service name
# and resource attributes, so Loki queries and Tempo queries land on
# the same workload.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trace-emitter
  namespace: observability
  labels:
    app.kubernetes.io/name: trace-emitter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trace-emitter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trace-emitter
    spec:
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: telemetrygen
          image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.113.0
          args:
            - traces
            - --otlp-endpoint=otelcol-gateway.observability.svc:4317
            - --otlp-insecure
            - --rate=5
            - --duration=24h
            - --service=demo-trace-emitter
            - --otlp-attributes=k8s.namespace.name="observability"
            - --otlp-attributes=cluster="oci-ampere-a1"
            - --telemetry-attributes=operation="demo"
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-emitter
  namespace: observability
  labels:
    app.kubernetes.io/name: log-emitter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: log-emitter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: log-emitter
    spec:
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: telemetrygen
          image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.113.0
          args:
            - logs
            - --otlp-endpoint=otelcol-gateway.observability.svc:4317
            - --otlp-insecure
            - --rate=2
            - --duration=24h
            - --body=request processed order_id=42
            - --otlp-attributes=k8s.namespace.name="observability"
            - --otlp-attributes=cluster="oci-ampere-a1"
            - --otlp-attributes=service.name="demo-log-emitter"
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
